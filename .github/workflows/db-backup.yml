name: Database Backup (Supabase)

on:
  schedule:
    # Runs every day at 03:00 UTC (4:00 AM Italian time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows you to trigger the backup manually from the GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          # Add PostgreSQL official repository to get the latest pg_dump (matches Supabase version)
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Create Backup Directory
        run: mkdir -p backups

      - name: Run pg_dump
        env:
          # This secret must be configured in your GitHub repository settings (Settings -> Secrets and variables -> Actions)
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "❌ ERROR: The DATABASE_URL secret is not set in GitHub repository settings!"
            exit 1
          fi
          
          # Set backup filename with timestamp
          DATE=$(date +%Y-%m-%d_%H-%M-%S)
          BACKUP_FILE="backups/supabase_backup_$DATE.sql"
          
          echo "🔄 Starting pg_dump..."
          pg_dump "$DB_URL" -F p -b -v -f "$BACKUP_FILE"
          
          echo "📦 Compressing backup..."
          gzip "$BACKUP_FILE"
          
          echo "✅ Backup successfully created: ${BACKUP_FILE}.gz"
          echo "BACKUP_PATH=${BACKUP_FILE}.gz" >> $GITHUB_ENV

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 90 # GitHub keeps these files for 90 days for free
