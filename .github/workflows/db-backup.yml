name: Database Daily Backup

on:
  schedule:
    - cron: '0 3 * * *' # Esegue ogni notte alle 03:00 UTC (04:00 o 05:00 in Italia)
  workflow_dispatch: # Consente di avviare il backup manualmente dalla scheda Actions di GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          # Aggiunge il repository ufficiale PostgreSQL per ottenere pg_dump v16 (che corrisponde alla versione di Supabase)
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Generate Backup Filename
        id: vars
        run: |
          # Crea un nome file univoco con data e ora corrente
          echo "filename=supabase-backup-$(date +%Y-%m-%d_%H-%M-%S).sql.gz" >> $GITHUB_OUTPUT

      - name: Run pg_dump and Compress
        run: |
          set -o pipefail
          # Rimuove il parametro pgbouncer dalla stringa di connessione prima di eseguire pg_dump
          RAW_URL="${{ secrets.DATABASE_URL }}"
          CLEAN_URL=$(echo "$RAW_URL" | sed -E 's/([?&])pgbouncer=[^&]*&?/\1/g' | sed 's/[?&]$//g' | sed 's/?&/?/g')
          
          # Esegue pg_dump e lo comprime al volo con gzip
          pg_dump "$CLEAN_URL" | gzip > ${{ steps.vars.outputs.filename }}

      - name: Upload to Cloudflare R2
        run: |
          # Utilizza l'AWS CLI preinstallato sull'immagine di GitHub Actions
          # specificando l'endpoint di Cloudflare R2
          aws s3 cp ${{ steps.vars.outputs.filename }} s3://${{ secrets.R2_BUCKET_NAME }}/${{ steps.vars.outputs.filename }} \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
